<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Kuray</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <nav>
        <a class="btn" href="./index.html">Home</a>
        <a class="btn" href="./projects.html">Projects</a>
        <a class="btn" href="./blog.html">Blog</a>
        <a class="btn" href="./contact.html">Contact</a>
        <a class="btn" href="./credits.html">Credits</a>
    </nav>

    <main>
        <header class="hero">
            <h1>Projecten</h1>
            <p class="hero-text">
                Hierbij vind je mijn open-source projecten
                <br>
                die ook op GitHub te vinden zijn.
                <br>
                Klik op de projectnaam om naar de GitHub repository te gaan.
            </p>
        </header>

        <section aria-labelledby="projects-heading">
            <h2 id="projects-heading">Mijn projecten</h2>
            <label class="filter" for="project-filter">Filter op categorie
                <select id="project-filter">
                    <option value="all">Alle projecten</option>
                    <option value="C++">C++</option>
                    <option value="Web">Web</option>
                    <option value="AI">AI</option>
                </select>
            </label>
            <p id="project-status" class="status" aria-live="polite"></p>
            <article id="project-list" class="card-container"></article>
        </section>
    </main>

    <footer>
        <div class="footer-copyright">
            <p>&copy; 2026 Portfolio Kuray | </p>
            <a target="_blank" href="https://github.com/JustKurayy">
                <img class="logo" src="./assets/img/github.svg" title="GitHub" alt="GitHub Logo" width="25"
                    height="25">
            </a>
        </div>
    </footer>
    <script src="./app.js" defer></script>
</body>

</html>
